[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "template"
version = "0.0.1"
description = ""
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [{ name = "", email = "" }]
keywords = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Typing :: Typed",
]
requires-python = ">=3.11, <3.15"
dependencies = []

[project.urls]
repository = ""
documentation = ""
changelog = ""

[dependency-groups]
tests = ["pytest", "pytest-cov"]
docs = [
    "zensical>=0.0.54",
    "mkdocstrings-python>=2.0.0",
]
dev = ["ruff", "ty", "pre-commit"]

[tool.ruff]
src = ["src", "tests"]
line-length = 99
exclude = [".venv", "venv", "build", "dist", "*.egg-info", ".github"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "COM812",
  "COM819",
  "ISC001",
  "D205",
  "TRY003",
  "EM101",
  "EM102",
  "ERA001",
  "ANN401",
  "PLC0415",
  "SIM115",
  "PYI063",
]

unfixable = ["T20", "F841"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I002"]
"tests/**" = ["ANN", "ARG", "D", "E402", "PTH", "S101", "PLR2004", "I002"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["docs/**", ".github/**"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
